---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      versions-per-runner:
        description: >-
          Python versions tested concurrently on each runner (default 6, i.e.
          one runner). Use 1 to restore one runner per version for benchmarks.
        type: choice
        options: ["1", "2", "3", "6"]
        required: false

env:
  FORCE_COLOR: "1" # Make tools pretty.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp

      # Each supported Python version is one unit of work. Every version is
      # assigned to exactly one runner; the runner tests its versions
      # concurrently with `tox run-parallel`.
      - name: Count supported Python versions
        id: versions
        env:
          VERSIONS: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
        run: echo "count=$(jq length <<< "$VERSIONS")" >> "$GITHUB_OUTPUT"
      - uses: gigaverse-app/ci-esta/actions/plan-runner-pools@efc310f0264abd2f8806f005648e16dbfe6f38f5 # v1.7.0
        id: pools
        with:
          shards: ${{ steps.versions.outputs.count }}
          shards-per-runner: ${{ inputs.versions-per-runner || '6' }}
      - name: Attach Python versions to each runner
        id: matrix
        env:
          VERSIONS: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
          POOLS: ${{ steps.pools.outputs.pools }}
        run: >
          echo "pools=$(jq -c --argjson v "$VERSIONS"
          'map(. + {versions: $v[.first_shard - 1:.last_shard]})' <<< "$POOLS")"
          >> "$GITHUB_OUTPUT"

    outputs:
      # Used to define the matrix for tests below. The versions are based on
      # packaging metadata (trove classifiers).
      test-pools: ${{ steps.matrix.outputs.pools }}

  tests:
    name: Tests & Mypy API on ${{ join(matrix.pool.versions, ', ') }}
    runs-on: ubuntu-latest
    needs: build-package

    strategy:
      fail-fast: false
      matrix:
        pool: ${{ fromJson(needs.build-package.outputs.test-pools) }}

    steps:
      - name: Download pre-built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - run: |
          tar xf dist/*.tar.gz --strip-components=1
          rm -rf src
      - name: List this runner's Python versions
        id: versions
        env:
          VERSIONS: ${{ toJSON(matrix.pool.versions) }}
        run: |
          {
            echo 'setup<<EOF'
            jq -r '.[]' <<< "$VERSIONS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.setup }}
          allow-prereleases: true
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      # Selects {version}-tests*, and {version}-mypy for every version on
      # this runner: the same environments the per-version jobs ran.
      - name: Run tests and check public API with Mypy
        env:
          VERSIONS: ${{ toJSON(matrix.pool.versions) }}
          POOL: ${{ matrix.pool.id }}
        run: |
          factors=()
          for version in $(jq -r '.[]' <<< "$VERSIONS"); do
            factors+=(-f "$version")
          done
          uvx --with tox-uv tox run-parallel --parallel auto \
            --parallel-no-spinner --installpkg dist/*.whl \
            --result-json "tox-results-$POOL.json" "${factors[@]}"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.pool.id }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload test inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tox-results-${{ matrix.pool.id }}
          path: tox-results-*.json
          if-no-files-found: error

  coverage:
    name: Ensure 100% test coverage
    runs-on: ubuntu-latest
    needs: tests
    if: always()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version-default
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage and fail if it's <100%.
        run: |
          uv tool install coverage

          coverage combine
          coverage html --skip-covered --skip-empty

          # Report and write to summary.
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

          # Report again and fail if under 100%.
          coverage report --fail-under=100

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}

  typing:
    name: Check types using supported type checkers
    runs-on: ubuntu-latest
    needs: build-package

    steps:
      - name: Download pre-built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - run: tar xf dist/*.tar.gz --strip-components=1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version-default
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - run: >
          uvx --with tox-uv
          tox run -f typing

  docs:
    name: Run doctests
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - name: Download pre-built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - run: tar xf dist/*.tar.gz --strip-components=1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version-default
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - run: >
          uvx --with tox-uv
          tox run -e docs-doctests

  install-dev:
    name: Verify dev env
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version-default
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - run: uv venv
      - run: uv pip install -e . --group dev

      - run: .venv/bin/python -Ic 'import structlog; print(structlog.__version__)'
        if: runner.os != 'Windows'
      - run: .\.venv\Scripts\python.exe -Ic 'import structlog; print(structlog.__version__)'
        if: runner.os == 'Windows'

      # Exercise the terminal initialization that we don't test otherwise.
      - run: uv pip install colorama
        if: runner.os == 'Windows'
      - run: .\.venv\Scripts\python.exe -Ic 'import structlog; log = structlog.get_logger(); log.info("colors"); structlog.dev.ConsoleRenderer.get_active().colors = False; log.info("bw")'
        if: runner.os == 'Windows'

  required-checks-pass:
    name: Ensure everything required is passing for branch protection
    if: always()

    needs:
      # `coverage` runs even when a test job fails, and versions that are not
      # measured for coverage cannot lower it, so test results are gated
      # directly.
      - tests
      - coverage
      - install-dev
      - typing
      - docs

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  colors:
    name: Visual check for color settings using env variables
    needs: build-package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version-default
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - run: >
          uvx --with=tox-uv
          tox run
          -f color
